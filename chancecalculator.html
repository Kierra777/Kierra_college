<!doctype html>
<html lang="en">
<head>
    <title>Chance Calculator</title>

    <meta charset="utf-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-sm">
        <div class="container">

            <a class="navbar-brand" href="#">
                College Tracker
            </a>

            <button
                class="navbar-toggler d-lg-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapsibleNavId"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavId">

                <ul class="navbar-nav me-auto"></ul>

                <button
                    class="btn btn-outline-primary"
                    onclick="window.location.href='index.html'"
                >
                    Back to Tracker
                </button>

            </div>

        </div>
    </nav>
</header>

<main>

<div class="container">

    <div class="row">

        <div class="col-12 transparent">

            <h1 class="title text-center">
                College Acceptance Calculator
            </h1>

            <div class="text-background p-4">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <input
                            type="text"
                            id="collegeName"
                            class="form-control"
                            placeholder="College Name"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <input
                            type="number"
                            id="acceptanceRate"
                            class="form-control"
                            placeholder="Acceptance Rate %"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <input
                            type="number"
                            step="0.01"
                            id="gpa"
                            class="form-control"
                            placeholder="GPA"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <input
                            type="number"
                            id="act"
                            class="form-control"
                            placeholder="ACT Score"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <input
                            type="number"
                            id="activities"
                            class="form-control"
                            placeholder="Activities / Leadership"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <input
                            type="number"
                            id="rigor"
                            class="form-control"
                            placeholder="AP / Honors Classes"
                        >
                    </div>

                </div>

                <button
                    class="btn btn-primary"
                    onclick="calculateChance()"
                >
                    Calculate Chance
                </button>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-12">

            <div
                id="result"
                class="text-background text-center p-4"
            >

                Enter your information and click
                "Calculate Chance".

            </div>

        </div>

    </div>

</div>

</main>

<footer>

    <div class="container-footer">

        <div class="row">

            <div class="col-12">

                <p class="footer-text text-center">
                    © 2026 College Tracker
                </p>

            </div>

        </div>

    </div>

</footer>

<script src="js/calculator.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
