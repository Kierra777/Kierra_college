<!doctype html>
<html lang="en">
<head>
    <title>College Tracker</title>

    <meta charset="utf-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-sm">
        <div class="container">
            <a class="navbar-brand" href="#">College Tracker</a>

            <button
                class="navbar-toggler d-lg-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapsibleNavId"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavId">

                <ul class="navbar-nav me-auto"></ul>

                <form class="d-flex">
                    <input
                        class="form-control me-2"
                        type="text"
                        id="searchInput"
                        placeholder="Search Colleges"
                    >

                    <button
                        class="btn btn-outline"
                        type="button"
                    >
                        Search
                    </button>
                </form>

            </div>
        </div>
    </nav>
</header>

<main>

<div class="container mt-4">

    <div class="row">

        <div class="col-12 transparent">

            <h1 class="title text-center">
                Kierra's College Tracker
            </h1>

            <div class="text-background p-4">

                <h3>Add College</h3>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <input
                            type="text"
                            id="collegeName"
                            class="form-control"
                            placeholder="College Name"
                        >
                    </div>

                    <div class="col-md-4 mb-3">
                        <input
                            type="date"
                            id="deadline"
                            class="form-control"
                        >
                    </div>

                    <div class="col-md-4 mb-3">
                        <input
                            type="number"
                            id="cost"
                            class="form-control"
                            placeholder="Yearly Cost"
                        >
                    </div>

                    <div class="col-md-4 mb-3">
                        <input
                            type="number"
                            id="acceptanceRate"
                            class="form-control"
                            placeholder="Acceptance Rate %"
                        >
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <select id="testPolicy" class="form-select">
                            <option>Test Optional</option>
                            <option>Test Required</option>
                            <option>Test Blind</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <select
                            id="applicationType"
                            class="form-select"
                        >
                            <option>ED</option>
                            <option>EA</option>
                            <option>Regular</option>
                            <option>Rolling</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <select
                            id="decision"
                            class="form-select"
                        >
                            <option>Pending</option>
                            <option>Accepted</option>
                            <option>Rejected</option>
                            <option>Waitlisted</option>
                        </select>
                    </div>

                    <div class="col-md-12 mb-3">
                        <input
                            type="text"
                            id="notes"
                            class="form-control"
                            placeholder="Notes"
                        >
                    </div>

                </div>

                <button
                    class="btn btn-primary"
                    onclick="addCollege()"
                >
                    Add College
                </button>

                <button
                    class="btn btn- ms-2"
                    onclick="window.location.href='chancecalculator.html'"
                >
                    Chance Calculator
                </button>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-12">

            <div class="table-responsive">

                <table class="table table-striped table-bordered">

                    <thead>

                        <tr>
                            <th>College</th>
                            <th>Deadline</th>
                            <th>Cost</th>
                            <th>Acceptance Rate</th>
                            <th>Test Policy</th>
                            <th>Application Type</th>
                            <th>Decision</th>
                            <th>Notes</th>
                            <th>Delete</th>
                        </tr>

                    </thead>

                    <tbody id="collegeTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</main>

<footer>
    <div class="container-footer">
        <div class="row">
            <div class="col-12">
                <p class="footer-text text-center">
                    © 2026 College Tracker
                </p>
            </div>
        </div>
    </div>
</footer>

<script src="tracker.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
